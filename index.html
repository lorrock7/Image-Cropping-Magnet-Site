<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="https://unpkg.com/cropperjs@1.6.2/dist/cropper.min.css"
    >
    <link rel="stylesheet" href="style.css">
    <title> Cropping Image Magnet Test </title>
</head>

<body>
    <div class="container">
        <h1>Image Upload and Cropper</h1>

        <!-- Image Slots -->
        <div id="imageSlots" class="image-slots"></div>

        <!-- Editor -->
        <div id="editor" class="editor">
            <h2>Edit Image</h2>
            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >
            <div class="image-container">
                <img id="image">
            </div>
            <button id="cropButton">
                Save Crop
            </button>
        </div>

    </div>

    <script src="https://unpkg.com/cropperjs@1.6.2/dist/cropper.min.js"></script>
    <script src="cropping.js"></script>

</body>

</html>
